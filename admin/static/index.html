<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>DayOne Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="brand">
        <strong>DayOne</strong>
      </div>
      <nav id="main-nav" aria-label="Sections">
        <a href="#dashboard" data-view="dashboard" class="nav-link"><span class="nav-icon">▦</span><span>Vue d'ensemble</span></a>
        <a href="#review" data-view="review" class="nav-link"><span class="nav-icon">▤</span><span>Relecture</span><span class="nav-badge" id="nav-pending">0</span></a>
        <a href="#bot" data-view="bot" class="nav-link"><span class="nav-icon">◉</span><span>Bot local</span></a>
        <a href="#settings" data-view="settings" class="nav-link"><span class="nav-icon">⚙</span><span>Configuration</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="privacy-note">Sur cet ordinateur</div>
        <div class="sidebar-role">Administrateur local</div>
        <form id="logout-form" action="/logout" method="post"><button type="submit" class="logout-button">Se déconnecter <span aria-hidden="true">↗</span></button></form>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="crumb"><a href="#dashboard">Accueil</a><span aria-hidden="true">›</span><strong id="crumb-current">Vue d'ensemble</strong></div>
        <div class="topbar-right"><span class="environment-badge">Données fictives</span><span class="avatar" aria-label="Administrateur local">AD</span></div>
      </header>
      <div id="global-error" class="global-error" role="alert" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      <main id="app-main" tabindex="-1"><div class="loading-panel">Chargement de la console…</div></main>
    </div>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
